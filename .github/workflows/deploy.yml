name: CI/CD - Deploy to S3 and CloudFront

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFRONT_ID: ${{ secrets.CLOUDFRONT_ID }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Test
        run: |
          test -f index.html || { echo "index.html is missing"; exit 1; }
          test -f styles.css || { echo "styles.css is missing"; exit 1; }
          test -f script.js  || { echo "script.js is missing"; exit 1; }
          grep -q "Version:" index.html || { echo "No version found in index.html"; exit 1; }
          echo "All tests passed."

      - name: Build / Package
        run: |
          mkdir -p dist
          cp index.html styles.css script.js dist/
          echo "Build complete. Files packaged into dist/:"
          ls -la dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to S3
        run: aws s3 sync dist/ s3://${{ secrets.S3_BUCKET }} --delete

      - name: Invalidate CloudFront cache
        if: ${{ env.CLOUDFRONT_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_ID" \
            --paths "/*"
